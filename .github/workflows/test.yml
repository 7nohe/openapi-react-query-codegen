name: test
concurrency:
  # `github.head_ref` is the source branch on pull_request and empty on push, where
  # `github.ref` takes over. Grouping per branch is what keeps a new push to one PR
  # from cancelling an unrelated PR's in-flight run.
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Dependency lifecycle scripts run in this job, so keep its token minimal.
    permissions:
      contents: read # to check out the repository
      pull-requests: write # for the coverage report comment
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `version` is omitted on purpose: the action then reads
      # `packageManager` from package.json, which pins the exact pnpm version.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -w build

      - name: Run codegen for react-app
        run: pnpm --filter @7nohe/react-app generate:api

      - name: Run codegen for nextjs-app
        run: pnpm --filter nextjs-app generate:api

      - name: Run codegen for tanstack-router-app
        run: pnpm --filter tanstack-router-app generate:api

      - name: Archive generated query files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-query-file-${{ matrix.os }}
          path: examples/react-app/openapi/queries

      - name: Run tsc in react-app
        run: pnpm --filter @7nohe/react-app test:generated

      - name: Run tsc in nextjs-app
        run: pnpm --filter nextjs-app test:generated

      - name: Run next build in nextjs-app
        run: pnpm --filter nextjs-app build

      - name: Run tsc in tanstack-router-app
        run: pnpm --filter tanstack-router-app test:generated

      - name: Run biome
        run: pnpm biome check .
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Run test
        run: pnpm test

      - name: Report coverage
        if: always() && matrix.os == 'ubuntu-latest'
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
